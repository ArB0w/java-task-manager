<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
    <script src="/js/app.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Task Manager</h1>
            <p>Správa tvých úkolů na jednom místě</p>
        </div>
    </header>

    <main class="container">

        <section class="task-form-section">
            <h2 id="form-title">Nový úkol</h2>

            <form id="task-form">

                <input type="hidden" id="task-id">

                <div class="form-group">
                    <label for="title">Název úkolu</label>
                    <input type="text" id="title" maxlength="200" placeholder="Zadej název úkolu" required>
                </div>

                <div class="form-group">
                    <label for="description">Popis</label>
                    <textarea id="description" placeholder="Popis úkolu"></textarea>
                </div>

                <div class="form-group">
                    <label for="due-date">Termín dokončení</label>
                    <input type="datetime-local" id="due-date">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-button">
                        Přidat úkol
                    </button>

                    <button type="button" id="cancel-button" class="button-secondary" hidden>
                        Zrušit úpravu
                    </button>
                </div>

            </form>
        </section>

        <section class="tasks-section">
            <div class="tasks-header">
                <h2>Moje úkoly</h2>
                <button id="refresh-button" class="button-secondary">
                    Obnovit
                </button>
            </div>

            <p id="status-message" class="status-message"></p>

            <div id="tasks-list" class="tasks-list">
                <!-- Úkoly se načtou pomocí JavaScriptu -->
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>Task Manager – Spring Boot REST API</p>
    </footer>

</body>

</html>
