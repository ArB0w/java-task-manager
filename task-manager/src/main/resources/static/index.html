<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
    <script src="/js/app.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Task Manager</h1>
            <p>Správa tvých úkolů na jednom místě</p>
        </div>
    </header>

    <main class="container">

        <!-- Přihlášení a registrace -->
        <section id="auth-section" class="task-form-section">
            <h2>Přihlášení</h2>

            <form id="login-form">

                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Heslo</label>
                    <input type="password" id="login-password" required>
                </div>

                <button type="submit">Přihlásit se</button>
            </form>

            <hr>

            <h2>Registrace</h2>

            <form id="register-form">

                <div class="form-group">
                    <label for="register-email">E-mail</label>
                    <input type="email" id="register-email" required>
                </div>

                <div class="form-group">
                    <label for="register-password">Heslo (minimálně 8 znaků)</label>
                    <input type="password" id="register-password" minlength="8" required>
                </div>

                <button type="submit">Zaregistrovat se</button>
            </form>

            <p id="auth-message" class="status-message"></p>
        </section>

        <!-- Správa úkolů -->
        <div id="app-section" hidden>

            <div class="tasks-header">
                <p id="user-info"></p>
                <button type="button" id="logout-button" class="button-secondary">
                    Odhlásit se
                </button>
            </div>

            <section class="task-form-section">
                <h2 id="form-title">Nový úkol</h2>

                <form id="task-form">

                    <input type="hidden" id="task-id">

                    <div class="form-group">
                        <label for="title">Název úkolu</label>
                        <input type="text" id="title" maxlength="200" placeholder="Zadej název úkolu" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Popis</label>
                        <textarea id="description" placeholder="Popis úkolu"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="due-date">Termín dokončení</label>
                        <input type="datetime-local" id="due-date">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-button">
                            Přidat úkol
                        </button>

                        <button type="button" id="cancel-button" class="button-secondary" hidden>
                            Zrušit úpravu
                        </button>
                    </div>

                </form>
            </section>

            <section class="tasks-section">
                <div class="tasks-header">
                    <h2>Moje úkoly</h2>
                    <button id="refresh-button" class="button-secondary">
                        Obnovit
                    </button>
                </div>

                <p id="status-message" class="status-message"></p>

                <div class="task-filters">

                    <div class="form-group">
                        <label for="search-title">Vyhledávání podle názvu</label>
                        <input type="search" id="search-title" placeholder="Hledat úkol...">
                    </div>

                    <div class="form-group">
                        <label for="filter-completed">Stav úkolů</label>
                        <select id="filter-completed">
                            <option value="">Všechny úkoly</option>
                            <option value="false">Nedokončené</option>
                            <option value="true">Dokončené</option>
                        </select>
                    </div>

                </div>

                <div id="tasks-list" class="tasks-list">
                    <!-- Úkoly se načtou pomocí JavaScriptu -->
                </div>
            </section>

        </div>

    </main>

    <footer class="footer">
        <p>Task Manager – Spring Boot REST API</p>
    </footer>

</body>

</html>
